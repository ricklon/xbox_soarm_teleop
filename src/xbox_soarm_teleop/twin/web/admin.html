<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Workshop arms</title>
<style>
  :root {
    --bg: #f4f2ee; --panel: #ffffff; --ink: #1d2126; --muted: #5d6670; --line: #d9d5cc;
    --accent: #0b6e69; --stop: #c2271d; --warn: #9a5b00; --key: #ece8df;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #15181b; --panel: #1f2428; --ink: #e9e6df; --muted: #a0a8b0; --line: #343b42;
      --accent: #3fb8b0; --stop: #ef5a4e; --warn: #e3a444; --key: #2a3036;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { display: flex; align-items: center; gap: 14px; padding: 14px 20px; flex-wrap: wrap; }
  header h1 { font-size: 20px; margin: 0; flex: 1; }
  #load { color: var(--muted); font-variant-numeric: tabular-nums; }
  #where { color: var(--muted); flex-basis: 100%; order: 9; }
  #where.local { color: var(--warn); }
  #enter { margin: 8px 20px 0; max-width: 620px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px; }
  #enter input { font: inherit; width: min(100%, 420px); padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--ink); }
  #enterError { color: var(--stop); margin-left: 8px; }
  .keyless #copyInstructor, .keyless #copyAll, .keyless #releaseAll, .keyless #stopAll { display: none; }
  button {
    font: inherit; color: var(--ink); background: var(--key); border: 1px solid var(--line);
    border-radius: 8px; padding: 8px 12px; cursor: pointer;
  }
  button.stop { background: var(--stop); color: #fff; border-color: var(--stop); font-weight: 700; }
  #rooms { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 14px; padding: 4px 20px 28px; }
  .room { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px; }
  .room img { width: 100%; aspect-ratio: 4 / 3; background: #0d0f11; border-radius: 6px; display: block; }
  .room h2 { font-size: 15px; margin: 8px 0 2px; display: flex; justify-content: space-between; gap: 8px; }
  .room .who { font-weight: 400; color: var(--muted); font-size: 13px; }
  .room .state { font-weight: 600; }
  .room .state.stopped { color: var(--stop); }
  .room .state.agent { color: var(--warn); }
  .room .last { color: var(--muted); font-size: 13px; min-height: 1.4em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .room .links { display: flex; gap: 10px; font-size: 13px; margin-top: 6px; }
  a { color: var(--accent); }
  .linkbtn { background: none; border: 0; padding: 0; color: var(--accent); text-decoration: underline; cursor: pointer; }
</style>
</head>
<body>
<header>
  <h1>Workshop arms</h1>
  <span id="load"></span>
  <span id="where"></span>
  <button id="copyInstructor" title="Puts the link to this page, key included, on your clipboard without showing it">Copy instructor link</button>
  <button id="copyAll">Copy all student links</button>
  <button id="releaseAll">Release all stops</button>
  <button id="stopAll" class="stop">STOP ALL</button>
</header>
<form id="enter" hidden>
  <p>This tab does not have the instructor key yet. On the instructor page the hub opened on its own
    computer, click <b>Copy instructor link</b>, then paste it here. What you paste is hidden.</p>
  <input id="keyBox" type="password" autocomplete="off" spellcheck="false"
    placeholder="Paste the instructor link" aria-label="Instructor link or key">
  <button type="submit">Open</button>
  <span id="enterError" role="alert"></span>
</form>
<div id="rooms"></div>
<script>
(() => {
  // The link carries the key. Keep it for this tab and take it out of the
  // address bar, so a shared screen does not show it. Reloading still works.
  const KEY_STORE = "soarm-admin-key";
  const linked = location.pathname.match(/^\/admin\/([^/]+)\/?$/);
  let key = linked ? linked[1] : null;
  try {
    if (key) { sessionStorage.setItem(KEY_STORE, key); history.replaceState(null, "", "/instructor"); }
    else key = sessionStorage.getItem(KEY_STORE);
  } catch (err) { /* no storage: the key stays in the address and the page still works */ }
  if (!key) {
    // This short address has no key of its own, and a key remembered at one
    // address (say 127.0.0.1) is not shared with another (a tunnel's). Take
    // it from a pasted instructor link, in a box that hides it.
    document.body.classList.add("keyless");
    const form = document.getElementById("enter"), box = document.getElementById("keyBox");
    const error = document.getElementById("enterError");
    form.hidden = false; box.focus();
    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      const pasted = box.value.trim();
      const found = pasted.match(/\/admin\/([\w-]+)/);
      const candidate = found ? found[1] : pasted;
      box.value = "";
      if (!/^[\w-]{8,}$/.test(candidate)) { error.textContent = "That is not an instructor link."; return; }
      let ok = false;
      try { ok = (await fetch(`/admin/${candidate}/rooms`, { cache: "no-store" })).ok; } catch (err) { /* below */ }
      if (!ok) { error.textContent = "That link was not recognised by this hub."; return; }
      try { sessionStorage.setItem(KEY_STORE, candidate); location.reload(); }
      catch (err) { location.href = "/admin/" + candidate; }
    });
    return;
  }
  const base = "/admin/" + key;
  const cards = new Map();
  let rooms = [];
  // Links to hand out use the address students can reach (the hub's
  // --public-url), not wherever this page happens to be open.
  let studentBase = location.origin;
  const link = (r) => `${studentBase}/r/${r.token}`;
  const here = (r) => `${location.origin}/r/${r.token}`;

  function card(r) {
    const el = document.createElement("div");
    el.className = "room";
    el.innerHTML = `<img alt=""><h2><span class="name"></span><span class="who"></span></h2>
      <div class="state"></div><div class="last"></div>
      <div class="links"><button class="linkbtn open">Open</button>
      <button class="linkbtn copy">Copy link</button></div>`;
    // Buttons, not links: hovering over a link shows its address, key included.
    el.querySelector(".open").addEventListener("click", () => window.open(here(r), "_blank", "noopener"));
    el.querySelector(".copy").addEventListener("click", () => navigator.clipboard.writeText(link(r)));
    document.getElementById("rooms").append(el);
    return el;
  }

  async function refresh() {
    try {
      const res = await fetch(base + "/rooms", { cache: "no-store" });
      const data = await res.json();
      rooms = data.rooms;
      const where = document.getElementById("where");
      if (data.public_url) {
        studentBase = data.public_url.replace(/\/$/, "");
        where.className = "";
        where.textContent = `Student links use ${studentBase}`;
      } else {
        const local = ["localhost", "127.0.0.1", "[::1]"].includes(location.hostname);
        where.className = local ? "local" : "";
        where.textContent = local
          ? "Student links only work on this computer. For students, start the hub with --public-url."
          : `Student links use ${studentBase}`;
      }
      document.getElementById("load").textContent =
        `${rooms.length} arms, loop ${data.loop_hz.toFixed(0)} Hz`;
      for (const r of rooms) {
        if (!cards.has(r.token)) cards.set(r.token, card(r));
        const el = cards.get(r.token);
        el.querySelector(".name").textContent = r.name;
        el.querySelector(".who").textContent =
          [r.page_open ? "page open" : "", r.agent ? "agent connected" : ""].filter(Boolean).join(", ") || "nobody here";
        const state = el.querySelector(".state");
        state.textContent = r.status[0];
        state.className = "state" + (r.stop ? " stopped" : r.status[0].startsWith("Agent") ? " agent" : "");
        el.querySelector(".last").textContent = r.last_event || "";
      }
    } catch (err) { document.getElementById("load").textContent = "not connected"; }
  }

  // One thumbnail at a time, round the room, so watching costs the hub little.
  let turn = 0;
  async function thumb() {
    if (rooms.length && !document.hidden) {
      const r = rooms[turn++ % rooms.length];
      try {
        const res = await fetch(`/r/${r.token}/camera.jpg?view=overhead&w=240&h=180`, { cache: "no-store" });
        if (res.ok) {
          const img = cards.get(r.token).querySelector("img"), old = img.src;
          img.src = URL.createObjectURL(await res.blob());
          if (old.startsWith("blob:")) URL.revokeObjectURL(old);
        }
      } catch (err) { /* shown by refresh */ }
    }
    setTimeout(thumb, 250);
  }

  const post = (path) => fetch(base + path, { method: "POST" }).then(refresh);
  document.getElementById("stopAll").addEventListener("click", () => post("/stop_all"));
  document.getElementById("releaseAll").addEventListener("click", () => post("/release_all"));
  document.getElementById("copyInstructor").addEventListener("click", (event) => {
    navigator.clipboard.writeText(`${studentBase}/admin/${key}`);
    const button = event.currentTarget, label = button.textContent;
    button.textContent = "Copied"; setTimeout(() => { button.textContent = label; }, 1500);
  });
  document.getElementById("copyAll").addEventListener("click", () =>
    navigator.clipboard.writeText(rooms.map((r) => `${r.name}: ${link(r)}`).join("\n")));

  setInterval(refresh, 1000);
  refresh(); thumb();
})();
</script>
</body>
</html>
